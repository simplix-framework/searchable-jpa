name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Release branch'
        required: true
        default: 'master'

concurrency:
  group: release-${{ github.event.inputs.branch }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Extract and validate version
        id: version
        env:
          RELEASE_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          case "$RELEASE_BRANCH" in master|spring-boot-3x) ;; *) echo "Unsupported release branch"; exit 1;; esac
          # Extract current version from build.gradle
          CURRENT_VERSION=$(grep -oP "version = '\K[^']+" build.gradle | head -1)
          echo "Current version: $CURRENT_VERSION"

          # Check if it's a SNAPSHOT version
          if [[ ! "$CURRENT_VERSION" == *-SNAPSHOT ]]; then
            echo "::error::Current version '$CURRENT_VERSION' is not a SNAPSHOT version. Release aborted."
            exit 1
          fi

          # Remove -SNAPSHOT suffix to get release version
          RELEASE_VERSION=${CURRENT_VERSION%-SNAPSHOT}
          echo "Release version: $RELEASE_VERSION"

          if git rev-parse "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "::error::Release tag already exists"; exit 1
          fi

          # Export versions for subsequent steps
          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "release=$RELEASE_VERSION" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Setup Gradle Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Update project and documentation version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release }}
        run: |
          node scripts/set-project-version.mjs "$RELEASE_VERSION"
          git config --global user.email "thk@simplecore.kr"
          git config --global user.name "Taehwan Kwag"
          git add build.gradle README.md docs
          git commit -m "release: v$RELEASE_VERSION"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build and check
        run: |
          chmod +x ./gradlew
          npm ci
          npm run test:docs
          ./scripts/build-docs.sh
          ./gradlew clean check performanceTest --stacktrace

      # The release commit and its tag reach the repository before anything is published, so a
      # published artifact always has its source. Publishing is the step that cannot be undone and
      # comes last.
      - name: Push the release commit and its tag
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release }}
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          git tag -a "v$RELEASE_VERSION" -m "v$RELEASE_VERSION"
          git push --atomic origin "HEAD:refs/heads/$BRANCH" "v$RELEASE_VERSION"

      - name: Publish
        run: |
          ./gradlew publish --stacktrace
          sha256sum searchable-jpa-core/build/libs/*.jar searchable-jpa-openapi/build/libs/*.jar spring-boot-starter-searchable-jpa/build/libs/*.jar > SHA256SUMS
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update to Next Development Version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release }}
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          NEXT_VERSION=$(echo "$RELEASE_VERSION" | awk -F. '{$NF = $NF + 1;} 1' | sed 's/ /./g')-SNAPSHOT
          node scripts/set-project-version.mjs "$NEXT_VERSION"
          git add build.gradle README.md docs
          git commit -m "chore: prepare for next development version $NEXT_VERSION"
          git push origin "$BRANCH"

      - name: Generate Release Notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release }}
        run: node scripts/release-notes.mjs "$RELEASE_VERSION" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.release }}
          name: Release v${{ steps.version.outputs.release }}
          body_path: release-notes.md
          files: |
            searchable-jpa-core/build/libs/*.jar
            searchable-jpa-openapi/build/libs/*.jar
            spring-boot-starter-searchable-jpa/build/libs/*.jar
            SHA256SUMS
          fail_on_unmatched_files: true
          make_latest: ${{ github.event.inputs.branch == 'master' && 'true' || 'false' }}
          draft: false
          prerelease: false 
